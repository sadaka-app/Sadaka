
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>صدقة جارية عن شيماء سعيد</title>
  <link href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0f0f1a; --bg2:#1a1a2e; --bg3:#16213e;
  --card:rgba(255,255,255,0.07); --gold:#ffd700;
  --green:#4caf50; --text:#fff; --text2:#aaa;
  --border:rgba(255,255,255,0.12);
  --mushaf-bg:#fdf6e3; --mushaf-text:#1a1008;
  --mushaf-border:#c8a96e;
}
.light {
  --bg:#f0ece4; --bg2:#e0d9cc; --bg3:#d5ccbb;
  --card:rgba(0,0,0,0.05); --gold:#8b6914; --green:#2e7d32;
  --text:#1a1008; --text2:#6b5a3e; --border:rgba(0,0,0,0.12);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Amiri',serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background 0.3s,color 0.3s;overflow-x:hidden;}

/* ===== HEADER ===== */
.header{background:var(--bg2);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:200;border-bottom:1px solid var(--border);backdrop-filter:blur(10px);}
.header h1{font-size:13px;color:var(--gold);font-family:'Amiri',serif;}
.icon-btn{background:var(--card);border:1px solid var(--border);color:var(--text);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;}

/* ===== TABS ===== */
.tabs{display:flex;background:var(--bg2);border-bottom:2px solid var(--border);overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex:1;padding:10px 4px;text-align:center;font-size:11px;color:var(--text2);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;min-width:60px;transition:all 0.2s;font-family:'Amiri',serif;}
.tab.active{color:var(--gold);border-bottom-color:var(--gold);}

/* ===== PAGES ===== */
.page{display:none;padding:14px;}
.page.active{display:block;}

/* ===== HOME ===== */
.hero{text-align:center;padding:28px 16px;background:linear-gradient(135deg,rgba(255,215,0,0.08),rgba(76,175,80,0.05));border-radius:20px;border:1px solid rgba(255,215,0,0.2);margin-bottom:14px;}
.hero .moon{font-size:56px;margin-bottom:12px;animation:float 3s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.hero h2{font-size:20px;color:var(--gold);font-family:'Amiri',serif;}
.hero .name{font-size:26px;font-weight:700;margin:10px 0;color:var(--text);font-family:'Amiri',serif;}
.hero .ayah{font-size:15px;line-height:2.2;color:var(--text2);margin-top:14px;padding:14px;background:var(--card);border-radius:12px;font-family:'Amiri Quran',serif;border-right:3px solid var(--gold);}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat-card{background:var(--card);border-radius:15px;padding:14px;text-align:center;border:1px solid var(--border);}
.stat-num{font-size:32px;font-weight:700;color:var(--gold);font-family:'Amiri',serif;}
.stat-label{font-size:11px;color:var(--text2);margin-top:4px;}

/* ===== QURAN LIST ===== */
.search-box{width:100%;padding:10px 14px;border-radius:12px;background:var(--bg2);color:var(--text);border:1px solid var(--border);font-size:14px;margin-bottom:12px;font-family:'Amiri',serif;outline:none;}
.surah-list{display:grid;gap:8px;}
.surah-item{background:var(--card);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;border:1px solid var(--border);transition:all 0.2s;}
.surah-item:active{transform:scale(0.98);background:rgba(255,215,0,0.08);}
.surah-num{width:36px;height:36px;background:var(--gold);color:#111;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;font-family:'Amiri',serif;}
.surah-info{flex:1;}
.surah-name{font-size:17px;font-weight:700;font-family:'Amiri',serif;}
.surah-details{font-size:11px;color:var(--text2);margin-top:2px;}
.surah-type{font-size:11px;color:var(--gold);}

/* ===== SURAH SCREEN (FULL PAGE MUSHAF) ===== */
.surah-screen{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:var(--mushaf-bg);z-index:300;flex-direction:column;}
.surah-screen.open{display:flex;}
.surah-header{background:var(--bg2);padding:10px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);flex-shrink:0;}
.back-btn{background:var(--card);border:1px solid var(--border);color:var(--text);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;}
.surah-header h2{font-size:15px;color:var(--gold);flex:1;font-family:'Amiri',serif;}

/* Audio Bar */
.audio-bar{background:var(--bg2);padding:9px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);flex-shrink:0;}
.play-btn{background:var(--gold);color:#111;border:none;width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform 0.1s;}
.play-btn:active{transform:scale(0.9);}
.audio-info{flex:1;}
.audio-title{font-size:12px;color:var(--text);font-weight:700;}
.audio-status{font-size:11px;color:var(--text2);margin-top:2px;}
.clear-sel-btn{background:transparent;border:1px solid rgba(255,100,100,0.4);color:#ff6b6b;padding:5px 10px;border-radius:8px;cursor:pointer;font-size:11px;white-space:nowrap;}

/* Mushaf Pages */
.mushaf-pages-wrap{flex:1;overflow:hidden;position:relative;}
.mushaf-slider{display:flex;flex-direction:row;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;height:100%;scrollbar-width:none;}
.mushaf-slider::-webkit-scrollbar{display:none;}
.mushaf-page{
  flex:0 0 100vw;width:100vw;scroll-snap-align:center;
  padding:6px 10px 10px;overflow-y:auto;
  background:var(--mushaf-bg);color:var(--mushaf-text);
  font-family:'Amiri Quran',serif;font-size:14px;line-height:1.9;
  text-align:justify;text-justify:inter-word;
  border-right:none;
border-left:6px solid var(--mushaf-border);
border-right:6px solid var(--mushaf-border);
}
.mushaf-page:first-child{border-right:none;}
.surah-name-header{
  text-align:center;font-size:20px;font-weight:700;
  color:#5a3e00;margin:0 0 8px;padding:8px 20px;
  background:linear-gradient(90deg,transparent,rgba(200,169,110,0.3),transparent);
  border-top:2px solid var(--mushaf-border);border-bottom:2px solid var(--mushaf-border);
  font-family:'Amiri',serif;
}
.bismillah{
  text-align:center;font-size:22px;margin:8px 0 16px;
  color:#5a3e00;display:block;font-family:'Amiri Quran',serif;
}
.page-footer{text-align:center;font-size:13px;color:#8b6914;margin-top:20px;font-family:'Amiri',serif;}
.juz-label{font-size:12px;color:#8b6914;text-align:left;margin-bottom:6px;font-family:'Amiri',serif;}

/* Ayah spans */
.ayah-span{
  cursor:pointer;transition:background 0.2s;
  border-radius:4px;user-select:none;
  -webkit-touch-callout:none;padding:0 1px;
}
.ayah-span.selected{background:rgba(76,175,80,0.25);border-radius:4px;}
.ayah-span.playing{background:rgba(255,215,0,0.35);border-radius:4px;}
.ayah-sign{color:#8b6914;margin:0 3px;font-size:20px;}

/* Page nav dots */
.page-dots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:10;}
.page-dot{width:6px;height:6px;border-radius:50%;background:rgba(139,105,20,0.3);transition:background 0.2s;}
.page-dot.active{background:#8b6914;}

/* ===== AZKAR ===== */
.azkar-cats{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:5px;scrollbar-width:none;}
.azkar-cats::-webkit-scrollbar{display:none;}
.cat-btn{padding:7px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text2);font-size:12px;cursor:pointer;white-space:nowrap;transition:all 0.2s;font-family:'Amiri',serif;}
.cat-btn.active{background:var(--gold);color:#111;border-color:var(--gold);}
.zekr-card{background:var(--card);border-radius:15px;padding:16px;margin-bottom:12px;border:1px solid var(--border);transition:border-color 0.3s;}
.zekr-card.done-card{border-color:rgba(76,175,80,0.4);}
.zekr-title{font-size:12px;color:var(--gold);margin-bottom:8px;font-weight:700;}
.zekr-text{font-size:17px;line-height:2.3;text-align:justify;margin-bottom:12px;font-family:'Amiri Quran',serif;color:var(--text);}
.zekr-hadith{font-size:12px;color:var(--text2);border-right:2px solid var(--gold);padding-right:8px;margin-bottom:12px;line-height:1.7;}
.zekr-bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.zekr-counter{display:flex;align-items:center;gap:8px;}
.zekr-btn{background:var(--gold);color:#111;border:none;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:transform 0.1s;}
.zekr-btn:active{transform:scale(0.88);}
.zekr-count{font-size:20px;font-weight:700;color:var(--gold);min-width:32px;text-align:center;font-family:'Amiri',serif;}
.zekr-max{font-size:11px;color:var(--text2);}
.done-badge{background:#4caf50;color:#fff;padding:4px 10px;border-radius:10px;font-size:11px;display:none;}
.zekr-progress{width:100%;height:4px;background:var(--border);border-radius:2px;margin-top:10px;}
.zekr-prog-bar{height:100%;background:var(--gold);border-radius:2px;transition:width 0.3s;}

/* ===== TASBEH ===== */
.tasbeh-card{background:var(--card);border-radius:20px;padding:28px 20px;text-align:center;border:1px solid var(--border);}
.tasbeh-select{width:100%;padding:11px;border-radius:12px;background:var(--bg2);color:var(--text);border:1px solid var(--border);font-size:16px;margin-bottom:20px;text-align:center;font-family:'Amiri',serif;outline:none;}
.tasbeh-display{font-size:72px;font-weight:700;color:var(--gold);line-height:1;margin-bottom:6px;font-family:'Amiri',serif;transition:transform 0.1s;}
.tasbeh-display.bump{transform:scale(1.15);}
.tasbeh-circle{width:170px;height:170px;border-radius:50%;background:linear-gradient(135deg,var(--gold),#e07b00);border:none;font-size:60px;cursor:pointer;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 30px rgba(255,215,0,0.25);transition:transform 0.1s,box-shadow 0.1s;}
.tasbeh-circle:active{transform:scale(0.92);box-shadow:0 4px 15px rgba(255,215,0,0.15);}
.tasbeh-label-txt{font-size:15px;color:var(--text2);margin-bottom:14px;font-family:'Amiri',serif;}
.tasbeh-progress{width:100%;height:6px;background:var(--border);border-radius:3px;margin:14px 0 10px;}
.tasbeh-bar{height:100%;background:linear-gradient(90deg,var(--gold),#ff8c00);border-radius:3px;transition:width 0.3s;}
.reset-btn{background:transparent;border:1px solid var(--border);color:var(--text2);padding:10px 28px;border-radius:20px;cursor:pointer;font-size:13px;font-family:'Amiri',serif;}
.tasbeh-totals{font-size:12px;color:var(--text2);margin-top:10px;}

/* ===== FAVORITES ===== */
.fav-empty{text-align:center;padding:50px 20px;color:var(--text2);}
.fav-empty .icon{font-size:50px;margin-bottom:15px;}

/* ===== ACTION SHEET ===== */
.overlay-dimmer{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);z-index:550;}
.overlay-dimmer.show{display:block;}
.action-sheet{position:fixed;bottom:-100%;left:0;right:0;background:var(--bg2);padding:20px;border-radius:20px 20px 0 0;box-shadow:0 -5px 30px rgba(0,0,0,0.4);z-index:600;transition:bottom 0.3s cubic-bezier(.2,.8,.3,1);border-top:1px solid var(--border);}
.action-sheet.show{bottom:0;}
.action-title{font-size:14px;color:var(--gold);margin-bottom:14px;text-align:center;border-bottom:1px solid var(--border);padding-bottom:10px;font-family:'Amiri',serif;}
.action-ayah-preview{font-size:16px;color:var(--text2);text-align:center;margin-bottom:14px;font-family:'Amiri Quran',serif;line-height:1.8;direction:rtl;max-height:80px;overflow:hidden;}
.action-btn{width:100%;padding:12px 16px;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:12px;margin-bottom:8px;cursor:pointer;font-size:14px;text-align:right;display:flex;align-items:center;gap:10px;font-family:'Amiri',serif;transition:background 0.2s;}
.action-btn:active{background:rgba(255,215,0,0.1);}
.action-cancel{background:transparent;border:1px solid rgba(255,100,100,0.3);color:#ff6b6b;}

/* ===== MODALS ===== */
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.75);z-index:700;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.show{display:flex;}
.modal{background:var(--bg2);border-radius:20px;padding:22px;max-width:420px;width:100%;border:1px solid var(--border);max-height:85vh;overflow-y:auto;}
.modal h3{color:var(--gold);margin-bottom:12px;font-size:16px;font-family:'Amiri',serif;}
.modal-ayah{font-size:19px;line-height:2.3;color:var(--text);font-family:'Amiri Quran',serif;direction:rtl;text-align:justify;padding:12px;background:var(--card);border-radius:10px;margin-bottom:12px;border-right:3px solid var(--gold);}
.modal p{font-size:15px;line-height:2;color:var(--text);font-family:'Amiri',serif;}
.modal-source{font-size:12px;color:var(--green);margin-top:10px;border-right:2px solid var(--green);padding-right:8px;}
.modal-close{width:100%;padding:11px;background:var(--gold);color:#111;border:none;border-radius:12px;cursor:pointer;font-weight:700;margin-top:14px;font-size:14px;font-family:'Amiri',serif;}
</style>
</head>
<body>

<div class="header">
  <h1>🌙 صدقة جارية — شيماء سعيد</h1>
  <button class="icon-btn" onclick="toggleTheme()" id="themeBtn">☀️</button>
</div>

<div class="tabs">
  <div class="tab active" onclick="showPage('home',this)">🏠 الرئيسية</div>
  <div class="tab" onclick="showPage('quran',this)">📖 القرآن</div>
  <div class="tab" onclick="showPage('azkar',this)">🤲 الأذكار</div>
  <div class="tab" onclick="showPage('tasbeh',this)">📿 السبحة</div>
  <div class="tab" onclick="showPage('arbaeen',this)">🌿 الأربعين النووية</div>
  <div class="tab" onclick="showPage('favPage',this)">⭐ المفضلة</div>
</div>

<!-- HOME -->
<div class="page active" id="home">
  <div class="hero">
    <div class="moon">🌙</div>
    <h2>صدقة جارية</h2>
    <div class="name">شيماء سعيد</div>
    <div class="ayah">﴿ إِنَّا نَحْنُ نُحْيِي الْمَوْتَىٰ وَنَكْتُبُ مَا قَدَّمُوا وَآثَارَهُمْ ﴾</div>
  </div>
  <div class="stats">
    <div class="stat-card"><div class="stat-num" id="statTasbeh">0</div><div class="stat-label">تسبيحة اليوم</div></div>
    <div class="stat-card"><div class="stat-num" id="statAzkar">0</div><div class="stat-label">ذكر اليوم</div></div>
  </div>
</div>

<!-- QURAN -->
<div class="page" id="quran">
    <button id="offlineBtn" onclick="downloadAllForOffline()" style="width:100%; padding:10px; border-radius:12px; background:var(--gold); color:#111; border:none; font-weight:bold; cursor:pointer; margin-bottom:12px; font-family:'Amiri',serif;">
    📥 تحميل المصحف للقراءة بدون إنترنت
  </button>
  <div id="bookmarkBanner" style="display:none; background:linear-gradient(135deg, var(--gold), #ff8c00); padding:12px 15px; border-radius:12px; margin-bottom:12px; color:#111; font-family:'Amiri',serif; font-weight:bold; cursor:pointer; justify-content:space-between; align-items:center; box-shadow:0 4px 15px rgba(255,140,0,0.3);" onclick="goToBookmark()">
    <span>🔖 متابعة القراءة: <span id="bookmarkText">...</span></span>
    <span>←</span>
  </div>

  <input class="search-box" placeholder="🔍 ابحث عن سورة..." oninput="filterSurahs(this.value)">
  <div class="surah-list" id="surahList"></div>
</div>

<!-- SURAH SCREEN -->
<div class="surah-screen" id="surahScreen">
  <div class="surah-header">
    <button class="back-btn" onclick="closeSurah()">←</button>
    <h2 id="surahScreenTitle">السورة</h2>
    <button class="icon-btn" onclick="toggleFavSurah()" id="favSurahBtn">🤍</button>
  </div>
  <div class="audio-bar">
  <button class="play-btn" id="playBtn" onclick="toggleAudio()">▶</button>
  <div class="audio-info">
    <select id="reciterSelect" onchange="changeReciter()"> <!-- تأكد من اسم الدالة في onchange عندك -->
      <option value="minsh">المنشاوي</option>
      <option value="Husary">الحصري</option>
    </select>
    <div class="audio-status" id="audioStatus">اضغط تشغيل • اضغط مطولًا على آية للخيارات</div>
  </div>
  
  <!-- زرار تحميل الصوت الجديد -->
  <button id="downloadAudioBtn" onclick="downloadCurrentSurahAudio()" style="background:transparent; border:1px solid var(--gold); color:var(--gold); padding:5px 10px; border-radius:8px; cursor:pointer; font-size:11px; margin-left:5px; font-weight:bold; font-family:'Amiri',serif; transition:all 0.2s;">📥 تحميل الصوت</button>
  
  <button class="clear-sel-btn" id="clearSelBtn" onclick="clearSelection()" style="display:none">✕ إلغاء</button>
  <audio id="audioPlayer" onended="audioEnded()"></audio>
</div>

  <div class="mushaf-pages-wrap">
    <div class="mushaf-slider" id="mushafSlider"></div>
    <div class="page-dots" id="pageDots"></div>
  </div>
</div>

<!-- AZKAR -->
<div class="page" id="azkar">
  <div class="azkar-cats">
    <button class="cat-btn active" onclick="showAzkar('sabah',this)">🌅 الصباح</button>
    <button class="cat-btn" onclick="showAzkar('masa',this)">🌆 المساء</button>
    <button class="cat-btn" onclick="showAzkar('nawm',this)">🌙 النوم</button>
    <button class="cat-btn" onclick="showAzkar('salah',this)">🕌 بعد الصلاة</button>
  </div>
  <div id="azkarList"></div>
</div>

<!-- TASBEH -->
<div class="page" id="tasbeh">
  <div class="tasbeh-card">
    <select class="tasbeh-select" id="tasbehType" onchange="resetTasbeh()">
      <option>سبحان الله</option>
      <option>الحمد لله</option>
      <option>الله أكبر</option>
      <option>لا إله إلا الله</option>
      <option>أستغفر الله</option>
      <option>اللهم صل على النبي ﷺ</option>
      <option>سبحان الله وبحمده</option>
      <option>سبحان الله العظيم</option>
      <option>لا حول ولا قوة إلا بالله</option>
      <script>
  alert("السكريبت شغال!");
</script>
    </body>
