<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صدقة جارية عن شيماء سعيد</title>
<!-- استدعاء خط المصحف العثماني -->
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<style>
:root {
  --bg:#0f0f1a; --bg2:#1a1a2e; --bg3:#16213e;
  --card:rgba(255,255,255,0.07); --gold:#ffd700;
  --green:#4caf50; --text:#fff; --text2:#aaa;
  --border:rgba(255,255,255,0.1);
  --mushaf-bg: #1c2331; /* لون خلفية المصحف في الوضع الليلي */
  --mushaf-text: #e0e0e0;
}
.light { 
  --bg:#f5f5f0; --bg2:#e8e8e0; --bg3:#ddd;
  --card:rgba(0,0,0,0.05); --gold:#b8860b; --green:#2e7d32;
  --text:#111; --text2:#555; --border:rgba(0,0,0,0.1); 
  --mushaf-bg: #fdf6e3; /* لون بيج مشابه للصورة في الوضع الفاتح */
  --mushaf-text: #111;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:all 0.3s;}
.header{background:var(--bg2);padding:12px 15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:200;border-bottom:1px solid var(--border);}
.header h1{font-size:14px;color:var(--gold);}
.header-btns{display:flex;gap:8px;}
.icon-btn{background:var(--card);border:1px solid var(--border);color:var(--text);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;}
.tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);overflow-x:auto;}
.tab{flex:1;padding:11px 4px;text-align:center;font-size:11px;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;min-width:65px;}
.tab.active{color:var(--gold);border-bottom-color:var(--gold);}
.page{display:none;padding:15px;}
.page.active{display:block;}

/* الرئيسية وإحصائيات */
.hero{text-align:center;padding:35px 20px;background:var(--card);border-radius:20px;border:1px solid var(--border);margin-bottom:15px;}
.hero .moon{font-size:65px;margin-bottom:15px;}
.hero h2{font-size:22px;color:var(--gold);}
.hero .name{font-size:30px;font-weight:bold;margin:12px 0;}
.hero .ayah{font-size:16px;line-height:2;color:var(--text2);margin-top:15px;padding:15px;background:var(--card);border-radius:12px;}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px;}
.stat-card{background:var(--card);border-radius:15px;padding:15px;text-align:center;border:1px solid var(--border);}
.stat-num{font-size:28px;font-weight:bold;color:var(--gold);}
.stat-label{font-size:11px;color:var(--text2);margin-top:4px;}

/* القرآن */
.search-box{width:100%;padding:10px 15px;border-radius:12px;background:var(--bg2);color:var(--text);border:1px solid var(--border);font-size:14px;margin-bottom:12px;}
.surah-list{display:grid;gap:8px;}
.surah-item{background:var(--card);border-radius:12px;padding:14px;display:flex;align-items:center;gap:12px;cursor:pointer;border:1px solid var(--border);transition:all 0.2s;}
.surah-item:active{transform:scale(0.98);}
.surah-num{width:38px;height:38px;background:var(--gold);color:#111;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:13px;flex-shrink:0;}
.surah-info{flex:1;}
.surah-name{font-size:16px;font-weight:bold;}
.surah-details{font-size:11px;color:var(--text2);margin-top:3px;}
.surah-type{font-size:11px;color:var(--gold);}

/* شاشة السورة والمصحف */
.surah-screen{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:300;overflow-y:auto;}
.surah-header{background:var(--bg2);padding:12px 15px;display:flex;align-items:center;gap:10px;position:sticky;top:0;border-bottom:1px solid var(--border);z-index: 10;}
.back-btn{background:var(--card);border:1px solid var(--border);color:var(--text);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:18px;}
.surah-header h2{font-size:16px;color:var(--gold);flex:1;}
.audio-player{background:var(--bg2);padding:12px 15px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;position:sticky;top:61px;z-index: 10;}
.play-btn{background:var(--gold);color:#111;border:none;width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:18px;flex-shrink:0;}
.audio-info{flex:1;font-size:12px;color:var(--text2);}
.audio-title{font-size:13px;color:var(--text);font-weight:bold;}
.ayah-container{padding:15px;}

/* تنسيق المصحف الجديد المتصل */
.mushaf-page {
  background-color: var(--mushaf-bg);
  color: var(--mushaf-text);
  padding: 25px 20px;
  border-radius: 12px;
  border: 1px solid var(--border);
  font-family: 'Amiri Quran', serif;
  font-size: 26px;
  line-height: 2.3;
  text-align: justify;
  text-justify: inter-word;
}
.bismillah {
  text-align: center;
  font-size: 28px;
  margin-bottom: 20px;
  color: var(--gold);
}
.ayah-span {
  cursor: pointer;
  transition: background-color 0.2s, color 0.2s;
  padding: 2px;
  border-radius: 4px;
  user-select: none; /* لمنع تحديد النص العادي عند الضغط المطول */
}
/* تنسيق الآيات المحددة للتشغيل */
.ayah-span.selected {
  background-color: rgba(76, 175, 80, 0.2);
  color: var(--gold);
}
/* الآية التي تُقرأ حالياً */
.ayah-span.playing {
  background-color: rgba(255, 215, 0, 0.2);
  color: var(--gold);
  border-bottom: 2px dashed var(--gold);
}
.ayah-sign {
  color: var(--gold);
  margin: 0 4px;
  font-size: 22px;
}

/* الأذكار، السبحة، المفضلة كما هي... */
.azkar-cats{display:flex;gap:8px;margin-bottom:15px;overflow-x:auto;padding-bottom:5px;}
.cat-btn{padding:8px 16px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text2);font-size:12px;cursor:pointer;white-space:nowrap;}
.cat-btn.active{background:var(--gold);color:#111;border-color:var(--gold);}
.zekr-card{background:var(--card);border-radius:15px;padding:18px;margin-bottom:12px;border:1px solid var(--border);}
.zekr-text{font-size:17px;line-height:2.2;text-align:center;margin-bottom:12px;}
.zekr-bottom{display:flex;justify-content:space-between;align-items:center;}
.zekr-counter{display:flex;align-items:center;gap:10px;}
.zekr-btn{background:var(--gold);color:#111;border:none;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px;font-weight:bold;}
.zekr-count{font-size:18px;font-weight:bold;color:var(--gold);min-width:35px;text-align:center;}
.zekr-max{font-size:11px;color:var(--text2);}
.daleel-btn{background:var(--green);color:#fff;border:none;padding:6px 12px;border-radius:10px;cursor:pointer;font-size:12px;}
.done-badge{background:#4caf50;color:#fff;padding:3px 10px;border-radius:10px;font-size:11px;display:none;}
.tasbeh-card{background:var(--card);border-radius:20px;padding:30px 20px;text-align:center;border:1px solid var(--border);}
.tasbeh-select{width:100%;padding:12px;border-radius:12px;background:var(--bg2);color:var(--text);border:1px solid var(--border);font-size:15px;margin-bottom:20px;text-align:center;}
.tasbeh-circle{width:180px;height:180px;border-radius:50%;background:linear-gradient(135deg,var(--gold),#ff8c00);border:none;font-size:64px;cursor:pointer;margin:0 auto 15px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 30px rgba(255,215,0,0.3);transition:transform 0.1s;}
.tasbeh-circle:active{transform:scale(0.93);}
.tasbeh-count{font-size:80px;font-weight:bold;color:var(--gold);line-height:1;}
.tasbeh-label{font-size:14px;color:var(--text2);margin:8px 0 15px;}
.tasbeh-progress{width:100%;height:6px;background:var(--border);border-radius:3px;margin:15px 0;}
.tasbeh-bar{height:100%;background:var(--gold);border-radius:3px;transition:width 0.3s;}
.reset-btn{background:transparent;border:1px solid var(--border);color:var(--text2);padding:10px 30px;border-radius:20px;cursor:pointer;font-size:13px;}
.total-label{font-size:12px;color:var(--text2);margin-top:10px;}
.fav-empty{text-align:center;padding:50px 20px;color:var(--text2);}
.fav-empty .icon{font-size:50px;margin-bottom:15px;}

/* Modals العادية */
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:500;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.show{display:flex;}
.modal{background:var(--bg2);border-radius:20px;padding:25px;max-width:400px;width:100%;border:1px solid var(--border);}
.modal h3{color:var(--gold);margin-bottom:15px;font-size:16px;}
.modal p{font-size:18px;line-height:2.2;color:var(--text);}
.modal-source{font-size:12px;color:var(--green);margin-top:10px;}
.modal-close{width:100%;padding:10px;background:var(--gold);color:#111;border:none;border-radius:10px;cursor:pointer;font-weight:bold;margin-top:15px;}

/* قائمة خيارات الآية (القائمة السفلية) */
.action-sheet {
  position: fixed; bottom: -100%; left: 0; right: 0;
  background: var(--bg2); padding: 20px; border-radius: 20px 20px 0 0;
  box-shadow: 0 -5px 15px rgba(0,0,0,0.3);
  z-index: 600; transition: bottom 0.3s ease; border-top: 1px solid var(--border);
}
.action-sheet.show { bottom: 0; }
.action-title { font-size: 14px; color: var(--gold); margin-bottom: 15px; text-align: center; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
.action-btn {
  width: 100%; padding: 12px; background: var(--card); border: 1px solid var(--border);
  color: var(--text); border-radius: 12px; margin-bottom: 8px; cursor: pointer; font-size: 14px; text-align: right;
}
.action-btn:hover { background: var(--border); }
.overlay-dimmer {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5); z-index: 550;
}
.overlay-dimmer.show { display: block; }
</style>
</head>
<body>
<div class="header">
  <h1>🌙 صدقة جارية — شيماء سعيد</h1>
  <div class="header-btns">
    <button class="icon-btn" onclick="toggleTheme()" id="themeBtn">☀️</button>
  </div>
</div>
<div class="tabs">
  <div class="tab active" onclick="showPage('home',this)">🏠 الرئيسية</div>
  <div class="tab" onclick="showPage('quran',this)">📖 القرآن</div>
  <div class="tab" onclick="showPage('azkar',this)">🤲 الأذكار</div>
  <div class="tab" onclick="showPage('tasbeh',this)">📿 السبحة</div>
  <div class="tab" onclick="showPage('favPage',this)">⭐ المفضلة</div>
</div>

<!-- الصفحات ... -->
<div class="page active" id="home">
  <!-- محتوى الرئيسية لم يتغير -->
  <div class="hero">
    <div class="moon">🌙</div>
    <h2>صدقة جارية</h2>
    <div class="name">شيماء سعيد</div>
    <div class="ayah">﴿ إِنَّا نَحْنُ نُحْيِي الْمَوْتَىٰ وَنَكْتُبُ مَا قَدَّمُوا وَآثَارَهُمْ ﴾</div>
  </div>
  <div class="stats">
    <div class="stat-card"><div class="stat-num" id="statTasbeh">0</div><div class="stat-label">تسبيحة اليوم</div></div>
    <div class="stat-card"><div class="stat-num" id="statAzkar">0</div><div class="stat-label">ذكر اليوم</div></div>
  </div>
</div>

<div class="page" id="quran">
  <input class="search-box" placeholder="🔍 ابحث عن سورة..." oninput="filterSurahs(this.value)">
  <div class="surah-list" id="surahList"></div>
</div>

<!-- شاشة السورة المعدلة -->
<div class="surah-screen" id="surahScreen">
  <div class="surah-header">
    <button class="back-btn" onclick="closeSurah()">→</button>
    <h2 id="surahScreenTitle"></h2>
    <button class="icon-btn" onclick="toggleFavSurah()" id="favSurahBtn">🤍</button>
  </div>
  <div class="audio-player">
    <button class="play-btn" id="playBtn" onclick="toggleAudio()">▶️</button>
    <div class="audio-info">
      <div class="audio-title">المنشاوي — ترتيل</div>
      <div id="audioStatus">اضغط للتشغيل (حدد آيات للتشغيل المخصص)</div>
    </div>
    <audio id="audioPlayer" onended="audioEnded()"></audio>
  </div>
  <div class="ayah-container" id="ayahContainer"></div>
</div>

<!-- صفحات الأذكار والسبحة والمفضلة... لم تتغير -->
<div class="page" id="azkar"><div class="azkar-cats"><button class="cat-btn active" onclick="showAzkar('sabah',this)">🌅 صباح</button><button class="cat-btn" onclick="showAzkar('masa',this)">🌆 مساء</button><button class="cat-btn" onclick="showAzkar('nawm',this)">🌙 نوم</button><button class="cat-btn" onclick="showAzkar('salah',this)">🕌 بعد الصلاة</button></div><div id="azkarList"></div></div>
<div class="page" id="tasbeh"><div class="tasbeh-card"><select class="tasbeh-select" id="tasbehType" onchange="resetTasbeh()"><option>سبحان الله</option><option>الحمد لله</option><option>الله أكبر</option><option>لا إله إلا الله</option><option>أستغفر الله</option><option>اللهم صل على النبي ﷺ</option><option>سبحان الله وبحمده</option><option>سبحان الله العظيم</option></select><div class="tasbeh-count" id="tasbehCount">0</div><div class="tasbeh-label" id="tasbehLabel">سبحان الله</div><button class="tasbeh-circle" onclick="incrementTasbeh()">📿</button><div class="tasbeh-progress"><div class="tasbeh-bar" id="tasbehBar" style="width:0%"></div></div><button class="reset-btn" onclick="resetTasbeh()">↺ إعادة تعيين</button><div class="total-label" id="tasbehTotal"></div></div></div>
<div class="page" id="favPage"><div id="favContent"></div></div>

<!-- Modals -->
<div class="modal-overlay" id="infoModal">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <p id="modalText"></p>
    <div class="modal-source" id="modalSource"></div>
    <button class="modal-close" onclick="closeModals()">إغلاق</button>
  </div>
</div>

<!-- قائمة اختيارات الآية (Long Press Menu) -->
<div class="overlay-dimmer" id="overlayDimmer" onclick="closeActionMenu()"></div>
<div class="action-sheet" id="actionSheet">
  <div class="action-title" id="actionAyahTitle">الآية 1</div>
  <button class="action-btn" onclick="actionTafseer()">📝 التفسير الميسر</button>
  <button class="action-btn" onclick="actionSelect()">✅ تحديد / إلغاء تحديد للتشغيل</button>
  <button class="action-btn" onclick="actionShare()">🔗 مشاركة الآية</button>
</div>

<script>
// ----- المتغيرات الأساسية -----
const surahs = [
  // نفس قائمة السور التي لديك... أخذنا أول 5 كمثال للتجربة السريعة، ضع قائمتك كاملة هنا
  {n:1,name:'الفاتحة',ayat:7,type:'مكية',audio:'https://server8.mp3quran.net/afs/001.mp3'},
  {n:2,name:'البقرة',ayat:286,type:'مدنية',audio:'https://server8.mp3quran.net/afs/002.mp3'},
  {n:3,name:'آل عمران',ayat:200,type:'مدنية',audio:'https://server8.mp3quran.net/afs/003.mp3'},
  {n:4,name:'النساء',ayat:176,type:'مدنية',audio:'https://server8.mp3quran.net/afs/004.mp3'},
  {n:5,name:'المائدة',ayat:120,type:'مدنية',audio:'https://server8.mp3quran.net/afs/005.mp3'}
  // ... برجاء إضافة باقي الـ 114 سورة كما في كودك الأصلي
];

const azkarData = { /* بيانات الأذكار كما هي في كودك */ sabah:[{text:'سُبْحَانَ اللهِ وَبِحَمْدِهِ',count:100,daleel:'',source:''}] }; 

let isDark = true;
let currentSurah = null;
let currentAyahsData = []; // لتخزين الداتا الخاصة بالتفسير والأرقام
let isPlaying = false;
let favorites = JSON.parse(localStorage.getItem('favs') || '[]');
let tasbehCount = 0;
let tasbehTotal = parseInt(localStorage.getItem('tasbehTotal') || '0');

// ----- متغيرات التشغيل المتسلسل والضغط المطول -----
let selectedAyahsQueue = []; // الأيات التي تم تحديدها للتشغيل
let isPlayingQueue = false;
let currentQueueIndex = 0;
let pressTimer;
let startX, startY;
let isLongPress = false;
let activeAyahIndex = null; // الآية اللي ضغطنا عليها

// ----- الثيم -----
function toggleTheme() {
  isDark = !isDark;
  document.body.classList.toggle('light', !isDark);
  document.getElementById('themeBtn').textContent = isDark ? '☀️' : '🌙';
}

function showPage(id, el) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  el.classList.add('active');
  if(id === 'favPage') renderFav();
}

function renderSurahs(list) {
  document.getElementById('surahList').innerHTML = list.map(s => `
    <div class="surah-item" onclick="openSurah(${s.n})">
      <div class="surah-num">${s.n}</div>
      <div class="surah-info">
        <div class="surah-name">${s.name}</div>
        <div class="surah-details">${s.ayat} آية — ${s.type}</div>
      </div>
      <div class="surah-type">${favorites.includes('s'+s.n) ? '⭐' : ''}</div>
    </div>
  `).join('');
}
renderSurahs(surahs);

function filterSurahs(q) {
  renderSurahs(surahs.filter(s => s.name.includes(q) || String(s.n).includes(q)));
}

// دالة تحويل الأرقام الإنجليزية للعربية
function toArabicNumber(n) {
  const arabicDigits = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
  return n.toString().replace(/\d/g, d => arabicDigits[d]);
}

// ----- فتح السورة ورسم المصحف -----
async function openSurah(n) {
  currentSurah = surahs.find(s => s.n === n);
  document.getElementById('surahScreen').style.display = 'block';
  document.getElementById('surahScreenTitle').textContent = 'سورة ' + currentSurah.name;
  document.getElementById('favSurahBtn').textContent = favorites.includes('s'+n) ? '⭐' : '🤍';
  document.getElementById('ayahContainer').innerHTML = '<div style="text-align:center;padding:40px;color:var(--text2)">⏳ جاري تحميل الرسم العثماني...</div>';
  
  stopAudio();
  selectedAyahsQueue = []; // تصفير قائمة التشغيل المحددة
  
  try {
    const r = await fetch(`https://api.alquran.cloud/v1/surah/${n}/editions/quran-uthmani,ar.muyassar`);
    const d = await r.json();
    
    // حفظ البيانات في مصفوفة لسهولة الوصول للتفسير ورقم الآية العام (Global Number لملف الصوت)
    currentAyahsData = d.data[0].ayahs.map((a, i) => ({
      text: a.text,
      numberInSurah: a.numberInSurah,
      globalNumber: a.number, // رقم الآية العام في القرآن كله
      tafseer: d.data[1].ayahs[i].text
    }));

    // بناء شكل المصحف المتصل
    let html = `<div class="mushaf-page" id="mushafPage">`;
    
    // إضافة البسملة إذا لم تكن الفاتحة أو التوبة
    if(n !== 1 && n !== 9) {
       html += `<div class="bismillah">بِسْمِ ٱللَّهِ ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ</div>`;
    }

    html += currentAyahsData.map((a, index) => {
      // إزالة البسملة من أول آية لأننا حطيناها فوق (الفاتحة البسملة آية 1 فيها)
      let cleanText = a.text;
      if (n !== 1 && index === 0 && cleanText.startsWith('بِسْمِ ٱللَّهِ ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ')) {
          cleanText = cleanText.replace('بِسْمِ ٱللَّهِ ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ', '').trim();
      }
      
      // إضافة Events للتعرف على الضغطة المطولة والقصيرة
      return `<span class="ayah-span" id="ayah_${index}" 
        onmousedown="startPress(event, ${index})" ontouchstart="startPress(event, ${index})"
        onmousemove="cancelPress(event)" ontouchmove="cancelPress(event)"
        onmouseup="handleAyahUp(event, ${index})" ontouchend="handleAyahUp(event, ${index})">
        ${cleanText} <span class="ayah-sign">﴿${toArabicNumber(a.numberInSurah)}﴾</span>
      </span>`;
    }).join(' ');

    html += `</div>`;
    document.getElementById('ayahContainer').innerHTML = html;

  } catch(e) {
    document.getElementById('ayahContainer').innerHTML = '<div style="text-align:center;padding:40px;color:var(--text2)">تحتاج اتصال بالإنترنت لتحميل الآيات 🌐</div>';
  }
}

function closeSurah() {
  document.getElementById('surahScreen').style.display = 'none';
  stopAudio();
}

function toggleFavSurah() {
  if(!currentSurah) return;
  const key = 's'+currentSurah.n;
  if(favorites.includes(key)) favorites = favorites.filter(f => f !== key);
  else favorites.push(key);
  localStorage.setItem('favs', JSON.stringify(favorites));
  document.getElementById('favSurahBtn').textContent = favorites.includes(key) ? '⭐' : '🤍';
}

// ----- أحداث الضغط المطول (Long Press Logic) -----
function startPress(e, index) {
  isLongPress = false;
  startX = e.clientX || (e.touches && e.touches[0].clientX);
  startY = e.clientY || (e.touches && e.touches[0].clientY);
  
  pressTimer = setTimeout(() => {
    isLongPress = true;
    openActionMenu(index);
  }, 500); // نص ثانية تعتبر ضغطة مطولة
}

function cancelPress(e) {
  if(e && e.type.includes('move')) {
    let currentX = e.clientX || (e.touches && e.touches[0].clientX);
    let currentY = e.clientY || (e.touches && e.touches[0].clientY);
    // لو حرك صباعه أكتر من 10 بيكسل نلغي الضغطة المطولة (بيعمل Scroll)
    if (Math.abs(currentX - startX) > 10 || Math.abs(currentY - startY) > 10) {
      clearTimeout(pressTimer);
    }
    return;
  }
  clearTimeout(pressTimer);
}

function handleAyahUp(e, index) {
  cancelPress(e);
  if (!isLongPress) {
    // ضغطة عادية قصيرة: نفتح القائمة برضه عشان نسهل على المستخدم أو نحددها مباشرة (هنا هفتح القائمة)
    openActionMenu(index);
  }
}

// ----- قائمة الخيارات للآية (Menu) -----
function openActionMenu(index) {
  activeAyahIndex = index;
  const ayahNum = currentAyahsData[index].numberInSurah;
  document.getElementById('actionAyahTitle').textContent = `الآية رقم ﴿${toArabicNumber(ayahNum)}﴾`;
  document.getElementById('overlayDimmer').classList.add('show');
  document.getElementById('actionSheet').classList.add('show');
}

function closeActionMenu() {
  document.getElementById('overlayDimmer').classList.remove('show');
  document.getElementById('actionSheet').classList.remove('show');
}

// خيار التفسير
function actionTafseer() {
  closeActionMenu();
  const data = currentAyahsData[activeAyahIndex];
  document.getElementById('modalTitle').textContent = `📖 تفسير الآية ${data.numberInSurah}`;
  document.getElementById('modalText').textContent = data.tafseer;
  document.getElementById('modalSource').textContent = "المصدر: التفسير الميسر";
  document.getElementById('infoModal').classList.add('show');
}

// خيار تحديد الآية للتشغيل
function actionSelect() {
  closeActionMenu();
  const index = activeAyahIndex;
  const span = document.getElementById(`ayah_${index}`);
  
  // لو موجودة في القائمة شيلها، لو مش موجودة ضيفها
  if (selectedAyahsQueue.includes(index)) {
    selectedAyahsQueue = selectedAyahsQueue.filter(i => i !== index);
    span.classList.remove('selected');
  } else {
    selectedAyahsQueue.push(index);
    span.classList.add('selected');
  }
  
  // إعادة ترتيب الأيات تصاعدياً
  selectedAyahsQueue.sort((a,b) => a - b);
  
  // تحديث حالة مشغل الصوت
  if (selectedAyahsQueue.length > 0) {
    document.getElementById('audioStatus').textContent = `تم تحديد ${selectedAyahsQueue.length} آيات للتشغيل`;
  } else {
    document.getElementById('audioStatus').textContent = `اضغط للتشغيل (سيتم تشغيل السورة كاملة)`;
  }
}

// خيار المشاركة
function actionShare() {
  closeActionMenu();
  const data = currentAyahsData[activeAyahIndex];
  const shareText = `﴿ ${data.text} ﴾\n[سورة ${currentSurah.name}: ${data.numberInSurah}]\n\n- صدقة جارية عن شيماء سعيد`;
  
  if (navigator.share) {
    navigator.share({ title: 'آية من القرآن الكريم', text: shareText });
  } else {
    navigator.clipboard.writeText(shareText);
    alert('تم نسخ الآية للحافظة');
  }
}

function closeModals() {
  document.getElementById('infoModal').classList.remove('show');
}

// ----- مشغل الصوت المطور (للآيات المحددة أو السورة كاملة) -----
function toggleAudio() {
  if(!currentSurah) return;
  const audio = document.getElementById('audioPlayer');
  
  if(isPlaying) {
    audio.pause();
    isPlaying = false;
    document.getElementById('playBtn').textContent = '▶️';
    document.getElementById('audioStatus').textContent = 'متوقف';
  } else {
    // لو في آيات محددة، نشغلهم بس
    if (selectedAyahsQueue.length > 0) {
      isPlayingQueue = true;
      currentQueueIndex = 0;
      playNextInQueue();
    } else {
      // لو مفيش، نشغل السورة كلها زي الأول
      isPlayingQueue = false;
      audio.src = currentSurah.audio;
      audio.play();
      isPlaying = true;
      document.getElementById('playBtn').textContent = '⏸';
      document.getElementById('audioStatus').textContent = 'يُشغّل — ' + currentSurah.name;
    }
  }
}

function playNextInQueue() {
  if (currentQueueIndex >= selectedAyahsQueue.length) {
    stopAudio();
    document.getElementById('audioStatus').textContent = 'انتهت تلاوة الآيات المحددة 🌙';
    return;
  }
  
  const index = selectedAyahsQueue[currentQueueIndex];
  const ayahData = currentAyahsData[index];
  
  // شيل تظليل القراءة من كل الآيات وحطها عالآية الحالية
  document.querySelectorAll('.ayah-span').forEach(el => el.classList.remove('playing'));
  document.getElementById(`ayah_${index}`).classList.add('playing');
  
  // هنجيب ملف الصوت للآية دي مخصوص (بصوت المنشاوي) عن طريق الـ Global Number بتاعها
  const audioUrl = `https://cdn.islamic.network/quran/audio/128/ar.minshawi/${ayahData.globalNumber}.mp3`;
  
  const audio = document.getElementById('audioPlayer');
  audio.src = audioUrl;
  audio.play();
  
  isPlaying = true;
  document.getElementById('playBtn').textContent = '⏸';
  document.getElementById('audioStatus').textContent = `يُشغّل الآية رقم ${ayahData.numberInSurah}`;
}

function audioEnded() {
  if (isPlayingQueue) {
    // لو احنا في طابور التحديد، شغل الآية اللي بعدها
    currentQueueIndex++;
    playNextInQueue();
  } else {
    isPlaying = false;
    document.getElementById('playBtn').textContent = '▶️';
    document.getElementById('audioStatus').textContent = 'انتهت التلاوة 🌙';
  }
}

function stopAudio() {
  const audio = document.getElementById('audioPlayer');
  audio.pause();
  audio.src = '';
  isPlaying = false;
  isPlayingQueue = false;
  document.getElementById('playBtn').textContent = '▶️';
  document.getElementById('audioStatus').textContent = selectedAyahsQueue.length > 0 ? `تم تحديد ${selectedAyahsQueue.length} آيات` : 'اضغط للتشغيل';
  document.querySelectorAll('.ayah-span').forEach(el => el.classList.remove('playing'));
}

// ----- دوال السبحة وباقي الكود... -----
function incrementTasbeh() {
  tasbehCount++;
  tasbehTotal++;
  localStorage.setItem('tasbehTotal', tasbehTotal);
  document.getElementById('tasbehCount').textContent = tasbehCount;
  document.getElementById('tasbehLabel').textContent = document.getElementById('tasbehType').value;
  document.getElementById('tasbehBar').style.width = Math.min((tasbehCount % 33) / 33 * 100, 100) + '%';
  document.getElementById('tasbehTotal').textContent = 'الإجمالي الكلي: ' + tasbehTotal;
}
function resetTasbeh() {
  tasbehCount = 0;
  document.getElementById('tasbehCount').textContent = 0;
  document.getElementById('tasbehBar').style.width = '0%';
  document.getElementById('tasbehLabel').textContent = document.getElementById('tasbehType').value;
}
</script>
